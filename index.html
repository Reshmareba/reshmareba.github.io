---
layout: default
---

  <div class="content w-full md:w-4/5 h-full overflow-scroll">

      <!-- Hero Section -->
      <div class="px-6 py-8 mb-6">
          <h1 class="text-4xl md:text-5xl font-bold text-primary mb-4">Recipe Lab</h1>
          <p class="text-lg md:text-xl text-gray-700 leading-relaxed">
              Cook. Taste. Adjust. Repeat.
          </p>
      </div>

      <!-- Recipes Section -->
      <div class="recipes mb-24 py-8">
          <h2 class="text-red-950 md:text-primary uppercase font-semibold mb-2 px-6">All Recipes</h2>

          <div class="grid px-6 h-full grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
            {% assign sorted = site.recipes | sort:"date" | reverse %}
            {% for post in sorted %}
              <a class="recipe md:hover:scale-105 md:hover:rotate-1 transition block" href="{{ post.url | prepend: site.baseurl }}">
                <canvas class="aspect-video w-full rounded-xl bg-gray-100 mb-2 bg-cover bg-center"
                  {% for image in post.image %} 
                    style="background-image:url({{site.baseurl}}/images/{{ image }});"
                  {% endfor %}>
                </canvas>
                <h3 class="font-semibold leading-tight text-lg text-primary">{{ post.title }}</h3>
                {% if post.tags %}
                  <div class="flex flex-wrap gap-1 mt-2">
                    {% for tag in post.tags limit:3 %}
                      <span class="text-xs bg-gray-200 px-2 py-1 rounded">{{ tag }}</span>
                    {% endfor %}
                  </div>
                {% endif %}
              </a>
            {% endfor %}
          </div>
      </div>

  </div>
